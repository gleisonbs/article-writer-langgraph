[project]
name = "article-writer-langgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.94",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langchain-openai>=1.6.1",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
